name: Build Windows 0.51.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/release-0.51.1-preparation
    tags:
      - v0.51.1

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 test and package
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare verified offline runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Run source and real FFmpeg regression tests
        run: npm run check

      - name: Build Authenticode-signed NSIS Setup and Portable packages
        if: env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != ''
        run: npm run electron:build

      - name: Build unsigned internal preview packages
        if: env.CSC_LINK == '' || env.CSC_KEY_PASSWORD == ''
        env:
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:build:unsigned

      - name: Verify Windows packaged renderer and install lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem ../dist -Filter '*setup-0.51.1.exe' -File | Select-Object -First 1).FullName
          $portable = (Get-ChildItem ../dist -Filter '*portable-0.51.1.exe' -File | Select-Object -First 1).FullName
          if (-not $setup -or -not $portable) { throw 'Setup 或 Portable artifact 不存在。' }
          powershell -ExecutionPolicy Bypass -File scripts/verify-windows-installation.ps1 `
            -SetupPath $setup `
            -PortablePath $portable

      - name: Verify package archives and write SHA-256
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem ../dist -Filter '*.exe' -File
          if ($artifacts.Count -lt 2) { throw 'Expected Setup and Portable EXE files.' }
          foreach ($artifact in $artifacts) {
            & 7z t $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Archive validation failed: $($artifact.Name)" }
          }

          $requiredGuideFiles = @(
            'USER-GUIDE.html',
            'assets/ai-panel-toggle.osfvideo',
            'assets/azure-setup.osfvideo',
            'assets/azure-error-check.osfvideo'
          )
          foreach ($guideFile in $requiredGuideFiles) {
            $packagedGuideFile = Join-Path '../dist/win-unpacked/resources/docs/0.45.2' $guideFile
            if (-not (Test-Path -LiteralPath $packagedGuideFile -PathType Leaf)) {
              throw "Packaged operation guide file is missing: $guideFile"
            }
          }

          $releaseNotes = '../dist/win-unpacked/resources/app/RELEASE-NOTES-0.51.1.md'
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw 'Packaged 0.51.1 release notes are missing.'
          }
          $releaseNotesContent = Get-Content -LiteralPath $releaseNotes -Raw
          if ($releaseNotesContent -notmatch '本機 patch release candidate') {
            throw 'Packaged release notes are not the 0.51.1 candidate notes.'
          }
          if ($releaseNotesContent -match '尚未建立 `v0\.51\.0` tag') {
            throw 'Packaged release notes contain stale 0.51.0 candidate text.'
          }

          $breezeGuide = '../dist/win-unpacked/resources/app/docs/BREEZE-ASR-25.md'
          if (-not (Test-Path -LiteralPath $breezeGuide -PathType Leaf)) {
            throw 'Packaged Breeze ASR 25 guide is missing.'
          }

          $unexpectedBundledModel = '../dist/win-unpacked/resources/tools/whisper-models/ggml-small.bin'
          if (Test-Path -LiteralPath $unexpectedBundledModel) {
            throw 'Small model must use first-use download and must not inflate the release package.'
          }

          $unexpectedBreezeModel = '../dist/win-unpacked/resources/tools/breeze-asr/breeze-asr-25.pt'
          if (Test-Path -LiteralPath $unexpectedBreezeModel) {
            throw 'Breeze checkpoint must remain an optional external download and must not enter the release package.'
          }

          $latestMetadata = Get-Content -LiteralPath '../dist/latest.yml' -Raw
          if ($latestMetadata -notmatch '(?m)^version: 0\.51\.1$') {
            throw 'latest.yml does not identify package version 0.51.1.'
          }
          if ($latestMetadata -notmatch 'offline-subtitle-factory-setup-0\.51\.1\.exe') {
            throw 'latest.yml does not identify the 0.51.1 Setup artifact.'
          }
          if ($latestMetadata -match '尚未建立 `v0\.51\.0` tag') {
            throw 'latest.yml contains stale 0.51.0 candidate text.'
          }

          $artifacts | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content ../dist/SHA256SUMS-windows-x64.txt -Encoding utf8

          $signatures = $artifacts | ForEach-Object { Get-AuthenticodeSignature $_.FullName }
          $allSigned = ($signatures | Where-Object Status -ne 'Valid').Count -eq 0
          if ($allSigned) {
            'SIGNED RELEASE: Authenticode signatures are valid.' | Set-Content ../dist/SIGNING-STATUS-windows-x64.txt -Encoding utf8
          } else {
            'UNSIGNED INTERNAL PREVIEW: Windows may display Unknown Publisher or SmartScreen warnings.' | Set-Content ../dist/SIGNING-STATUS-windows-x64.txt -Encoding utf8
          }

          $provenanceFiles = @(
            $artifacts
            Get-ChildItem ../dist -Filter '*.blockmap' -File
            Get-Item ../dist/latest.yml
            Get-Item ../dist/SHA256SUMS-windows-x64.txt
            Get-Item ../dist/SIGNING-STATUS-windows-x64.txt
          ) | Sort-Object Name -Unique
          $assetRecords = @($provenanceFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [ordered]@{ name = $_.Name; size = $_.Length; sha256 = $hash }
          })
          [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            runId = [int64]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            ref = $env:GITHUB_REF
            sourceCommit = $env:GITHUB_SHA
            runnerImage = $env:ImageOS
            packageVersion = '0.51.1'
            assets = $assetRecords
          } | ConvertTo-Json -Depth 6 | Set-Content ../dist/BUILD-PROVENANCE-windows-x64.json -Encoding utf8

          $uploadDir = Join-Path $PWD '.artifacts/windows-x64'
          New-Item -ItemType Directory -Force -Path $uploadDir | Out-Null
          Copy-Item ../dist/*.exe -Destination $uploadDir
          Copy-Item ../dist/*.blockmap -Destination $uploadDir
          Copy-Item ../dist/latest.yml -Destination $uploadDir
          Copy-Item ../dist/SHA256SUMS-windows-x64.txt -Destination $uploadDir
          Copy-Item ../dist/SIGNING-STATUS-windows-x64.txt -Destination $uploadDir
          Copy-Item ../dist/BUILD-PROVENANCE-windows-x64.json -Destination $uploadDir

      - name: Upload Windows preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-subtitle-factory-0.51.1-windows-x64
          path: |
            app/.artifacts/windows-x64/*
          if-no-files-found: error
          retention-days: 14
